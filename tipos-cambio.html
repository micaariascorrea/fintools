<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <title>Tipos de cambio | ALLINARG</title>
  <meta name="description" content="Dólar MEP y CCL al último cierre, con fuente, horario y aviso si el dato tiene más de un día.">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-interna">
  <div class="ticker-wrap" aria-label="Precios de mercado">
    <div id="ticker-bar" class="ticker-bar"></div>
  </div>
  <div class="container">
    <div class="page-header-row">
      <a href="index.html" class="back-link">← Volver</a>
      <header class="site-header">
        <h1 class="site-logo"><img src="assets/logo-wordmark.png" alt="ALLINARG Financial Tools"></h1>
        <div class="header-marks">
          <span class="header-flag" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 16" width="32" height="22"><rect fill="#74ACDF" width="24" height="16"/><rect y="5.33" fill="#FFF" width="24" height="5.34"/><circle cx="12" cy="8" r="2.5" fill="#F4B800"/></svg></span>
        </div>
      </header>
    </div>

    <main class="page-content">
      <section class="form-block">
        <h2 class="tool-title">Tipos de cambio</h2>
        <p class="tool-desc">Dólar MEP y CCL. La columna Cierre es el último cierre de rueda.</p>
        <p id="tc-source" class="market-source" hidden></p>
        <p id="tc-stale" class="market-stale" hidden></p>

        <div class="carry-actions">
          <button type="button" id="btn-actualizar-tc">Actualizar datos</button>
        </div>

        <div class="result-wrap">
          <div id="mensaje" class="result-block empty" role="status">Cargando…</div>
          <button type="button" id="btn-reintentar" class="btn btn-secondary btn-retry" hidden>Reintentar</button>
          <div id="tc-wrap" class="result-table-wrap" style="display: none;">
            <table class="result-table">
              <thead>
                <tr>
                  <th>Tipo</th>
                  <th>Bid</th>
                  <th>Ask</th>
                  <th>Cierre</th>
                </tr>
              </thead>
              <tbody id="tc-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-contact">
        <span>X: <a href="https://x.com/allinarg" target="_blank" rel="noopener">@allinarg</a></span>
      </div>
      <p class="footer-disclaimer">Cálculos estimativos, no constituyen recomendación de inversión.</p>
    </footer>
  </div>

  <script>
    (function () {
      "use strict";
      var BASE = "https://data912.com";
      function $(id) { return document.getElementById(id); }

      function format(n) {
        return n != null && !isNaN(n) ? n.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—";
      }

      function todayYmd() {
        var parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/Argentina/Buenos_Aires",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(new Date());
        var y, m, d;
        parts.forEach(function (p) {
          if (p.type === "year") y = p.value;
          if (p.type === "month") m = p.value;
          if (p.type === "day") d = p.value;
        });
        return y + "-" + m + "-" + d;
      }

      function formatCierre(ymd) {
        var bits = ymd.split("-");
        if (bits.length !== 3) return ymd;
        return bits[2] + "/" + bits[1] + " 17:00";
      }

      function parseUtc(ymdStr) {
        var p = ymdStr.split("-");
        return Date.UTC(+p[0], +p[1] - 1, +p[2]);
      }

      function ymdFromUtc(ms) {
        var d = new Date(ms);
        var m = d.getUTCMonth() + 1;
        var day = d.getUTCDate();
        return d.getUTCFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
      }

      function addDays(ymdStr, n) {
        return ymdFromUtc(parseUtc(ymdStr) + n * 86400000);
      }

      function weekday(ymdStr) {
        return new Date(parseUtc(ymdStr)).getUTCDay();
      }

      function easterSunday(year) {
        var a = year % 19;
        var b = Math.floor(year / 100);
        var c = year % 100;
        var d = Math.floor(b / 4);
        var e = b % 4;
        var f = Math.floor((b + 8) / 25);
        var g = Math.floor((b - f + 1) / 3);
        var h = (19 * a + b - d - g + 15) % 30;
        var i = Math.floor(c / 4);
        var k = c % 4;
        var l = (32 + 2 * e + 2 * i - h - k) % 7;
        var m = Math.floor((a + 11 * h + 22 * l) / 451);
        var month = Math.floor((h + l - 7 * m + 114) / 31);
        var day = ((h + l - 7 * m + 114) % 31) + 1;
        return year + "-" + (month < 10 ? "0" : "") + month + "-" + (day < 10 ? "0" : "") + day;
      }

      /* Ley 27.399: martes y miércoles al lunes anterior; jueves a domingo al lunes siguiente. */
      function observedMonday(ymdStr) {
        var wd = weekday(ymdStr);
        if (wd === 2 || wd === 3) return addDays(ymdStr, 1 - wd);
        if (wd === 4 || wd === 5) return addDays(ymdStr, 8 - wd);
        if (wd === 6) return addDays(ymdStr, 2);
        if (wd === 0) return addDays(ymdStr, 1);
        return ymdStr;
      }

      var holidayCache = {};
      /* Cierres extraordinarios de BYMA que no salen de la ley (decretos). Los turísticos con negociación no van acá. */
      var EXTRA_CLOSED = {
        "2026-11-09": true,
        "2026-11-10": true,
        "2026-12-24": true,
        "2026-12-31": true
      };

      function holidaysFor(year) {
        if (holidayCache[year]) return holidayCache[year];
        var set = {};
        function add(s) { set[s] = true; }
        add(year + "-01-01");
        add(year + "-03-24");
        add(year + "-04-02");
        add(year + "-05-01");
        add(year + "-05-25");
        add(year + "-06-20");
        add(year + "-07-09");
        add(year + "-12-08");
        add(year + "-12-25");
        var eas = easterSunday(year);
        add(addDays(eas, -2));
        add(addDays(eas, -48));
        add(addDays(eas, -47));
        add(observedMonday(year + "-06-17"));
        add(observedMonday(year + "-08-17"));
        add(observedMonday(year + "-10-12"));
        add(observedMonday(year + "-11-20"));
        holidayCache[year] = set;
        return set;
      }

      function isMarketClosed(ymdStr) {
        var wd = weekday(ymdStr);
        if (wd === 0 || wd === 6) return true;
        return !!holidaysFor(+ymdStr.slice(0, 4))[ymdStr] || !!EXTRA_CLOSED[ymdStr];
      }

      function previousBusinessDay(ymdStr) {
        var d = addDays(ymdStr, -1);
        var guard = 0;
        while (isMarketClosed(d) && guard < 20) {
          d = addDays(d, -1);
          guard++;
        }
        return d;
      }

      function closeIsStale(closeDate, today) {
        if (!closeDate || closeDate >= today) return false;
        return closeDate < previousBusinessDay(today);
      }

      function fetchJson(url) {
        return fetch(url).then(function (r) {
          if (!r.ok) throw new Error("Data912 respondió " + r.status);
          return r.json();
        });
      }

      function lastCloseDate() {
        return fetchJson(BASE + "/historical/bonds/AL30").then(function (arr) {
          if (!Array.isArray(arr)) return null;
          var today = todayYmd();
          var best = null;
          arr.forEach(function (row) {
            if (!row || !row.date || row.date >= today) return;
            if (best == null || row.date > best) best = row.date;
          });
          return best;
        }).catch(function () { return null; });
      }

      function showError(message) {
        $("mensaje").textContent = message;
        $("mensaje").className = "result-block error";
        $("mensaje").style.display = "block";
        $("btn-reintentar").hidden = false;
        $("tc-wrap").style.display = "none";
        $("tc-source").hidden = true;
        $("tc-stale").hidden = true;
      }

      function run() {
        $("mensaje").textContent = "Cargando…";
        $("mensaje").className = "result-block empty";
        $("mensaje").style.display = "block";
        $("btn-reintentar").hidden = true;
        $("tc-wrap").style.display = "none";
        $("tc-source").hidden = true;
        $("tc-stale").hidden = true;

        Promise.all([
          fetchJson(BASE + "/live/mep"),
          fetchJson(BASE + "/live/ccl"),
          lastCloseDate()
        ]).then(function (results) {
          var mep = Array.isArray(results[0]) ? results[0] : [];
          var ccl = Array.isArray(results[1]) ? results[1] : [];
          var closeDate = results[2];
          var mepRow = mep.length ? mep[0] : null;
          var cclRow = ccl.length ? ccl[0] : null;

          var rows = [];
          if (mepRow && (mepRow.mark != null || mepRow.close != null)) {
            rows.push({ tipo: "Dólar MEP", bid: mepRow.bid, ask: mepRow.ask, close: mepRow.close });
          }
          if (cclRow && (cclRow.CCL_mark != null || cclRow.CCL_close != null)) {
            rows.push({ tipo: "Dólar CCL", bid: cclRow.CCL_bid, ask: cclRow.CCL_ask, close: cclRow.CCL_close });
          }

          if (!rows.length) {
            showError("Data912 no devolvió MEP ni CCL. Probá de nuevo en unos segundos.");
            return;
          }

          var source = $("tc-source");
          if (closeDate) {
            source.textContent = "Fuente: Data912 · Cierre del " + formatCierre(closeDate) + ". Bid y ask son la punta que publica Data912 al consultar; la columna Cierre es el último cierre de rueda BYMA (17:00).";
          } else {
            source.textContent = "Fuente: Data912 · la API no informó la fecha de cierre.";
          }
          source.hidden = false;

          var stale = $("tc-stale");
          if (closeDate && closeIsStale(closeDate, todayYmd())) {
            stale.textContent = "Este cierre tiene más de un día hábil.";
            stale.hidden = false;
          } else {
            stale.hidden = true;
          }

          $("mensaje").style.display = "none";
          $("btn-reintentar").hidden = true;
          $("tc-wrap").style.display = "block";

          var tbody = $("tc-body");
          tbody.innerHTML = "";
          rows.forEach(function (r) {
            var tr = document.createElement("tr");
            tr.innerHTML = "<td>" + r.tipo + "</td><td>$ " + format(r.bid) + "</td><td>$ " + format(r.ask) + "</td><td>$ " + format(r.close) + "</td>";
            tbody.appendChild(tr);
          });
        }).catch(function () {
          showError("No se pudieron cargar los tipos de cambio. Revisá la conexión e intentá de nuevo.");
        });
      }

      run();
      var btnTc = $("btn-actualizar-tc");
      if (btnTc) btnTc.addEventListener("click", run);
      var btnRetry = $("btn-reintentar");
      if (btnRetry) btnRetry.addEventListener("click", run);
    })();
  </script>
  <script src="assets/ticker.js"></script>
</body>
</html>
